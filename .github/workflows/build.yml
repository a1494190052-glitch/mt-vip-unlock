name: Build LSPosed Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Environment probe
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/build-tools" || true
          ls -la "$ANDROID_HOME/platforms" || true
          which java javac zip
          java -version 2>&1 || true

      - name: Build module
        run: |
          set +e
          bash build.sh > build.log 2>&1
          RC=$?
          echo "build_exit=$RC"
          echo "----- build.log -----"
          cat build.log
          echo "build_exit=$RC" >> $GITHUB_ENV
          exit 0

      - name: Publish build log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: build.log
          body: "automated build log (exit ${{ env.build_exit }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish apk
        if: env.build_exit == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: out/MTVIP-Unlock.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
